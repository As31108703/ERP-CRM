# 前面還有一層反向代理（例如 TLS 終端）時，保留它傳來的 X-Forwarded-Proto／X-Forwarded-Host，
# 後端才能以使用者實際看到的 origin 比對寫入請求、並替 https 的 cookie 加上 Secure；
# 標頭不存在或為空時才以本層的 $scheme／$http_host 補上
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 備份匯入上限 3 MiB，留一點餘裕給標頭與編碼
    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 同一層有 add_header 時不會繼承外層設定，安全標頭需逐一寫在 location 內
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
