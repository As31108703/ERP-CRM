x-default: &default
  restart: always
  tty: true
  stdin_open: true
  env_file:
    - .env

services:
  db:
    <<: *default
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: $DATABASE__USER
      POSTGRES_PASSWORD: $DATABASE__PASSWORD
      POSTGRES_DB: $DATABASE__NAME
      PGDATA: /data/postgres
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/postgres:/data/postgres
    ports:
      # 只綁本機：給本機開發與測試連線，不對區網開放資料庫
      - 127.0.0.1:5436:5432

  backend:
    <<: *default
    build:
      context: ./backend
    environment:
      DATABASE__HOST: db
      DATABASE__PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 只綁本機：方便直接除錯 API；對外一律經由 frontend 的 nginx
      - 127.0.0.1:8000:8000

  # 前端只是 nginx 靜態檔與反向代理，不需要 .env（避免把資料庫帳密帶進容器）
  frontend:
    restart: always
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      # 主機連接埠可用 .env 的 FRONTEND_PORT 覆寫（預設 8080）
      - ${FRONTEND_PORT:-8080}:80
