[project]
name = "erpcrm"
version = "0.1.0"
description = "星軌 ERP-CRM 模擬工作台後端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.7.0",
    "dependency-injector>=4.44.0",
    "loguru>=0.7.3",
    "apscheduler>=3.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.1",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
